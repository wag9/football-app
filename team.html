<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team page</title>
<link rel="stylesheet" href="style.css">
<style>
  .cards { display:flex; gap:12px; flex-wrap:wrap; margin-top:16px; }
  .card { background:#171a21; border:1px solid #262b36; border-radius:10px; padding:12px 16px; min-width:110px; }
  .card .v { font-size:1.4rem; font-weight:600; }
  .form { display:flex; gap:6px; margin-top:8px; }
  .pill { width:30px; height:30px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-weight:700; color:#0f1115; }
  .W { background:#4ade80; } .D { background:#facc15; } .L { background:#f87171; }
  #status { margin-top:16px; }
</style>
</head>
<body>
<a href="index.html">&larr; Back to table</a>
<div id="status" class="muted">Loading... (the first request can take ~30s while the free server wakes up)</div>
<div id="content" style="display:none">
  <h1 id="name"></h1>
  <div class="muted" id="sub"></div>
  <div class="cards" id="cards"></div>

  <h2>Elo history</h2>
  <div id="chart"></div>

  <h2>Last 5 matches</h2>
  <div class="form" id="form"></div>
  <table id="last5"></table>

  <h2>Predictions</h2>
  <table id="preds"></table>

  <h2>This season</h2>
  <table id="season"></table>
</div>

<script>

const LOCAL = ["127.0.0.1", "localhost", ""].includes(location.hostname);
const API = LOCAL ? "http://127.0.0.1:8000" : "https://football-app-37ck.onrender.com";
const LEAGUE = new URLSearchParams(location.search).get("league") || "E0";
document.querySelector('a[href="index.html"]').href = "index.html?league=" + encodeURIComponent(LEAGUE);

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}
function row(table, cells, header) {
  const tr = document.createElement("tr");
  cells.forEach(c => {
    const td = el(header ? "th" : "td");
    if (c instanceof Node) td.appendChild(c); else td.textContent = c;
    tr.appendChild(td);
  });
  table.appendChild(tr);
}
function teamLink(name) {
  const a = el("a", name);
  a.href = "team.html?name=" + encodeURIComponent(name) + "&league=" + encodeURIComponent(LEAGUE);
  return a;
}
function pct(x) { return (x * 100).toFixed(0) + "%"; }

function drawChart(points) {
  const box = document.getElementById("chart");
  box.innerHTML = "";
  if (points.length < 2) { box.textContent = "Not enough data."; return; }
  const NS = "http://www.w3.org/2000/svg";
  const W = 760, H = 240, L = 44, R = 10, T = 10, B = 24;
  const t = points.map(p => new Date(p.date).getTime());
  const v = points.map(p => p.elo);
  const t0 = Math.min(...t), t1 = Math.max(...t);
  const lo = Math.floor(Math.min(...v) / 20) * 20, hi = Math.ceil(Math.max(...v) / 20) * 20;
  const x = ms => L + (ms - t0) / (t1 - t0) * (W - L - R);
  const y = e => T + (hi - e) / (hi - lo) * (H - T - B);

  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.style.width = "100%";

  function add(tag, attrs, text) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (text !== undefined) n.textContent = text;
    svg.appendChild(n);
  }

  // horizontal grid + Elo labels
  for (let i = 0; i <= 4; i++) {
    const e = lo + (hi - lo) * i / 4;
    add("line", { x1: L, x2: W - R, y1: y(e), y2: y(e), stroke: "#262b36" });
    add("text", { x: L - 6, y: y(e) + 4, fill: "#9aa4b2", "font-size": 11, "text-anchor": "end" }, Math.round(e));
  }
  // vertical ticks every 1 Aug (season start)
  for (let yr = new Date(t0).getFullYear(); yr <= new Date(t1).getFullYear(); yr++) {
    const ms = new Date(yr, 7, 1).getTime();
    if (ms >= t0 && ms <= t1) {
      add("line", { x1: x(ms), x2: x(ms), y1: T, y2: H - B, stroke: "#262b36" });
      add("text", { x: x(ms) + 3, y: H - 8, fill: "#9aa4b2", "font-size": 11 }, "Aug " + yr);
    }
  }
  add("polyline", {
    points: points.map((p, i) => x(t[i]) + "," + y(p.elo)).join(" "),
    fill: "none", stroke: "#6ea8fe", "stroke-width": 2,
  });
  add("circle", { cx: x(t[t.length - 1]), cy: y(v[v.length - 1]), r: 4, fill: "#6ea8fe" });
  box.appendChild(svg);
}

function matchTable(table, matches) {
  table.innerHTML = "";
  row(table, ["Date", "Opponent", "H/A", "Score", "Result"], true);
  matches.forEach(m => {
    row(table, [m.date, teamLink(m.opponent), m.venue, m.gf + "-" + m.ga, el("span", m.result, "")]);
  });
}

async function load() {
  const name = new URLSearchParams(location.search).get("name");
  const status = document.getElementById("status");
  if (!name) { status.textContent = "No team selected."; return; }
  try {
    const res = await fetch(API + "/team?name=" + encodeURIComponent(name) + "&league=" + encodeURIComponent(LEAGUE));
    if (!res.ok) { status.textContent = "Team not found."; return; }
    const d = await res.json();
    document.title = d.team;
    document.getElementById("name").textContent = d.team;
    document.getElementById("sub").textContent = "Season " + d.season;

    const cards = document.getElementById("cards");
    const r = d.record;
    [["Elo", d.elo], ["Elo rank", d.elo_rank + " / " + d.n_teams],
     ["Record", r.W + "-" + r.D + "-" + r.L], ["Goals", r.GF + ":" + r.GA],
     ["Points", r.Pts]].forEach(([k, v]) => {
      const c = el("div", undefined, "card");
      c.appendChild(el("div", k, "muted"));
      c.appendChild(el("div", String(v), "v"));
      cards.appendChild(c);
    });

    const form = document.getElementById("form");
    d.last5.forEach(m => form.appendChild(el("div", m.result, "pill " + m.result)));
    matchTable(document.getElementById("last5"), d.last5);

    const preds = document.getElementById("preds");
    row(preds, ["Date", "Match", "Home", "Draw", "Away", "Score"], true);
    if (d.predictions.length === 0) {
      row(preds, ["No predictions logged for this team yet.", "", "", "", "", ""]);
    }
    d.predictions.forEach(p => {
      const match = document.createElement("span");
      match.appendChild(teamLink(p.home));
      match.appendChild(document.createTextNode(" vs "));
      match.appendChild(teamLink(p.away));
      row(preds, [p.date, match, pct(p.pH), pct(p.pD), pct(p.pA), p.score || "upcoming"]);
    });

    drawChart(d.history);
    matchTable(document.getElementById("season"), d.season_results);

    status.style.display = "none";
    document.getElementById("content").style.display = "block";
  } catch (e) {
    status.textContent = "Could not reach the server. Try again in a moment.";
  }
}
load();
</script>
</body>
</html>
