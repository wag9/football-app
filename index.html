<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Football Predictor</title>
  <link rel="stylesheet" href="style.css">
  <style>
    #summary { margin: 6px 0; color: #aaa; }
    .bar { display: flex; height: 26px; margin-top: 10px; border-radius: 4px; overflow: hidden; }
    .bar div { display: flex; align-items: center; justify-content: center; font-size: 13px; color: #000; }
    .h { background: #4caf50; } .d { background: #bbb; } .a { background: #f44336; }
  </style>
</head>
<body>
  <script src="nav.js"></script>
  <h1 id="title">Football Predictor</h1>
  <p id="status" class="muted">Loading data... the first load can take up to a minute while the server wakes up.</p>
   
  <div class="tabs">
    <button data-tab="upcoming" class="active">Upcoming</button>
    <button data-tab="table">Table</button>
    <button data-tab="week">All leagues</button>
    <button data-tab="predict">Predict</button>
  </div>

  <div class="panel active" id="panel-upcoming">
    <div id="summary"></div>
    <table id="fixtures"></table>
  </div>

  <div class="panel" id="panel-table">
    <table id="table"></table>
  </div>

  <div class="panel" id="panel-week">
    <table id="week"></table>
  </div>

  <div class="panel" id="panel-predict">
    <select id="home"></select> vs <select id="away"></select>
    <button onclick="predict()">Predict</button>
    <div id="result"></div>
  </div>

<script>
const LOCAL = ["127.0.0.1", "localhost", ""].includes(location.hostname);
const API = LOCAL ? "http://127.0.0.1:8000" : "https://football-app-37ck.onrender.com";
const LEAGUE = new URLSearchParams(location.search).get("league") || "E0";
const Q = "league=" + encodeURIComponent(LEAGUE);
const tl = (n) => `<a href="team.html?name=${encodeURIComponent(n)}&${Q}">${n}</a>`;

async function loadTeams() {
  const res = await fetch(`${API}/?${Q}`);
  const data = await res.json();
  if (!res.ok) { document.getElementById("status").textContent = data.detail || "League not found."; return; }
    map(l => `<option value="${l.code}" ${l.code === LEAGUE ? "selected" : ""}>${l.name}</option>`).join("");
  const cur = data.leagues.find(l => l.code === LEAGUE);
  if (cur) { document.getElementById("title").textContent = cur.name; document.title = cur.name; }
  for (const id of ["home", "away"]) {
    document.getElementById(id).innerHTML = data.teams.map(t => `<option>${t}</option>`).join("");
  }
  document.getElementById("away").selectedIndex = 1;
}

async function predict() {
  const home = document.getElementById("home").value;
  const away = document.getElementById("away").value;
  const out = document.getElementById("result");
  if (home === away) {
    out.textContent = "Please choose two different teams.";
    return;
  }
  const res = await fetch(`${API}/predict?home=${encodeURIComponent(home)}&away=${encodeURIComponent(away)}&${Q}`);
  const d = await res.json();
  if (!res.ok) { out.textContent = d.detail; return; }
  const p = d.prob;
  out.innerHTML = `
    <p>${d.home} (${d.elo_home}) vs ${d.away} (${d.elo_away})</p>
    <div class="bar">
      <div class="h" style="width:${p.home * 100}%">${Math.round(p.home * 100)}%</div>
      <div class="d" style="width:${p.draw * 100}%">${Math.round(p.draw * 100)}%</div>
      <div class="a" style="width:${p.away * 100}%">${Math.round(p.away * 100)}%</div>
    </div>`;
}

function showTab(name) {
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === "panel-" + name));
  history.replaceState(null, "", "#" + name);
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => showTab(b.dataset.tab));
const startTab = location.hash.slice(1);
showTab(["upcoming", "table", "week", "predict"].includes(startTab) ? startTab : "upcoming");

async function loadUpcoming() {
  const [fxRes, recRes] = await Promise.all([
    fetch(`${API}/fixtures?status=upcoming&${Q}`),
    fetch(`${API}/record?${Q}`),
  ]);
  const rows = (await fxRes.json()).slice(0, 10);     // next 10 only
  const rec = await recRes.json();

  let html = "<tr><th>Date</th><th>Match</th><th>H</th><th>D</th><th>A</th><th></th></tr>";
  for (const r of rows) {
    const p = r.prob;
    const top = Object.keys(p).reduce((a, b) => (p[a] >= p[b] ? a : b));
    const cell = (k) => `<td class="${k === top ? "top" : ""}">${Math.round(p[k] * 100)}%</td>`;
    html += `<tr><td>${r.date}</td><td class="team">${tl(r.home)} vs ${tl(r.away)}</td>
             ${cell("home")}${cell("draw")}${cell("away")}
             <td><a href="match.html?home=${encodeURIComponent(r.home)}&away=${encodeURIComponent(r.away)}&date=${r.date}&${Q}">Details</a></td></tr>`;
  }
  document.getElementById("fixtures").innerHTML =
    rows.length ? html : "<tr><td>No upcoming matches logged yet.</td></tr>";
  document.getElementById("summary").innerHTML =
    `Track record: ${rec.top_pick_correct}/${rec.played} top picks correct · <a href="predictions.html?${Q}">Full history</a>`;
}

async function loadWeek() {
  const res = await fetch(`${API}/upcoming?days=7`);
  const rows = await res.json();
  const tlx = (n, lg) => `<a href="team.html?name=${encodeURIComponent(n)}&league=${lg}">${n}</a>`;
  let html = "<tr><th>Date</th><th>League</th><th>Match</th><th>H</th><th>D</th><th>A</th><th></th></tr>";
  for (const r of rows) {
    const p = r.prob;
    const top = Object.keys(p).reduce((a, b) => (p[a] >= p[b] ? a : b));
    const cell = (k) => `<td class="${k === top ? "top" : ""}">${Math.round(p[k] * 100)}%</td>`;
    html += `<tr><td>${r.date}</td>
             <td><a href="index.html?league=${r.league}">${r.league_name}</a></td>
             <td class="team">${tlx(r.home, r.league)} vs ${tlx(r.away, r.league)}</td>
             ${cell("home")}${cell("draw")}${cell("away")}
             <td><a href="match.html?home=${encodeURIComponent(r.home)}&away=${encodeURIComponent(r.away)}&date=${r.date}&league=${r.league}">Details</a></td></tr>`;
  }
  document.getElementById("week").innerHTML =
    rows.length ? html : "<tr><td>No upcoming matches logged yet.</td></tr>";
}

async function loadTable() {
  const res = await fetch(`${API}/table?${Q}`);
  const rows = await res.json();
  let html = "<tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>";
  for (const r of rows) {
    html += `<tr><td>${r.Pos}</td><td class="team">${tl(r.Team)}</td><td>${r.P}</td><td>${r.W}</td><td>${r.D}</td><td>${r.L}</td><td>${r.GD}</td><td><b>${r.Pts}</b></td></tr>`;
  }
  document.getElementById("table").innerHTML = html;
  document.getElementById("status").style.display = "none";
}

loadUpcoming();
loadTeams();
loadTable();
loadWeek();
</script>
</body>
</html>
